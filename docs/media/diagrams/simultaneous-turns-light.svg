<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d">
<title id="t">How a simultaneous turn resolves</title><desc id="d">Every empire, human or AI, plans its orders at the same time. When everyone is ready, the Rust engine resolves the turn in six fixed stages and returns the same next state to every player.</desc>
