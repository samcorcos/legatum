<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
<title id="t">The AI sees what a player sees</title><desc id="d">The true game state is filtered through fog of war into a player's view. The AI receives exactly the same kind of view and plays under the same rules; harder levels think more, they do not get resource bonuses or hidden information.</desc>
<style>
text{font-family:'Avenir Next','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#efe5cc}
.serif{font-family:'Cormorant Garamond','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif}
.kick{font-size:12px;letter-spacing:.24em;fill:#e57a5f;font-weight:700}
.h{font-size:30px;font-weight:600}
.lab{font-size:11px;letter-spacing:.18em;fill:#b9ab8c;font-weight:700}
.sm{font-size:13px;fill:#b9ab8c}
.md{font-size:14px}
.bd{font-weight:700}
.c{text-anchor:middle}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><pattern id="hx" width="46" height="80" patternUnits="userSpaceOnUse"><path d="M0 20l11.5 -20h23l11.5 20l-11.5 20h-23z M23 60l11.5 -20h23" fill="none" stroke="rgba(239,229,204,.05)" stroke-width="1"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5z" fill="#b9ab8c"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="14" fill="#1b1712" stroke="#efe5cc" stroke-width="2"/>
<rect x="1" y="1" width="958" height="518" rx="14" fill="url(#hx)"/>
<rect x="8" y="8" width="944" height="504" rx="9" fill="none" stroke="#4c4333" stroke-width="1"/>
<text x="40" y="50" class="kick" >THE AI DOES NOT CHEAT</text><text x="40" y="90" class="serif h" >It sees what you see. It gets harder by deciding better.</text><rect x="40" y="132" width="190" height="130" rx="9" fill="#241f17" stroke="#efe5cc" stroke-width="1.5"/><text x="135" y="168" class="serif bd c" style="font-size:21px">The true game</text><text x="135" y="192" class="sm c" >every tile, every unit,</text><text x="135" y="210" class="sm c" >every treasury</text><text x="135" y="240" class="sm c" style="fill:#d6b25c;font-weight:600">only the engine knows</text><path d="M232 197H286" fill="none" stroke="#b9ab8c" stroke-width="2.2" marker-end="url(#ar)"/><path d="M290 160H410L370 197V232H330V197Z" fill="rgba(229,122,95,.16)" stroke="#e57a5f" stroke-width="2" stroke-linejoin="round"/><text x="350" y="150" class="lab c" style="fill:#e57a5f">FOG OF WAR</text><text x="350" y="258" class="sm c" >one shared filter</text><path d="M412 180H470" fill="none" stroke="#b9ab8c" stroke-width="2.2" marker-end="url(#ar)"/><path d="M412 214H470" fill="none" stroke="#b9ab8c" stroke-width="2.2" marker-end="url(#ar)"/><rect x="474" y="124" width="262" height="64" rx="9" fill="#241f17" stroke="#6fb3d6" stroke-width="2"/><text x="492" y="150" class="md bd" >Your view</text><text x="492" y="171" class="sm" style="font-size:12px">explored tiles · units in sight</text><rect x="474" y="200" width="262" height="64" rx="9" fill="#241f17" stroke="#8fc476" stroke-width="2"/><text x="492" y="226" class="md bd" >An AI empire’s view</text><text x="492" y="247" class="sm" style="font-size:12px">explored tiles · units in sight</text><path d="M738 156H786" fill="none" stroke="#b9ab8c" stroke-width="1.6" marker-end="url(#ar)"/><path d="M738 232H786" fill="none" stroke="#b9ab8c" stroke-width="1.6" marker-end="url(#ar)"/><rect x="790" y="132" width="130" height="132" rx="9" fill="#241f17" stroke="#efe5cc" stroke-width="2"/><text x="855" y="170" class="serif bd c" style="font-size:21px">Same rules</text><text x="855" y="196" class="sm c" >same engine,</text><text x="855" y="214" class="sm c" >same orders,</text><text x="855" y="232" class="sm c" >same limits</text><text x="40" y="316" class="lab" >WHAT “HARDER” MEANS</text><rect x="40" y="358" width="281" height="62" rx="7" fill="#241f17" stroke="#efe5cc" stroke-width="1.5"/><text x="54" y="384" class="md bd" >Easy</text><text x="54" y="404" class="sm" style="font-size:12px">simple choices</text><rect x="341" y="344" width="281" height="76" rx="7" fill="#241f17" stroke="#efe5cc" stroke-width="1.5"/><text x="355" y="370" class="md bd" >Normal</text><text x="355" y="390" class="sm" style="font-size:12px">solid choices</text><rect x="642" y="330" width="281" height="90" rx="7" fill="#241f17" stroke="#efe5cc" stroke-width="1.5"/><text x="656" y="356" class="md bd" >Hard</text><text x="656" y="376" class="sm" style="font-size:12px">plans and commits to a strategy</text><text x="40" y="454" class="md bd" >More thinking, never more resources: no hidden bonuses, no map hack, no extra Gold.</text><text x="40" y="480" class="sm" >It is tuned by hill-climbing against milestones that people reached in real games.</text>
</svg>
