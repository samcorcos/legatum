<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-labelledby="t d">
<title id="t">Legatum architecture</title><desc id="d">A deterministic Rust engine, legatum-core, takes game state, orders and a seed and returns the next state. The browser game and the online host (a player's tab) run it as WebAssembly; the headless runner runs it natively. The AI sees only a player's view, and the climb tunes the AI's parameters from runner results.</desc>
<style>
text{font-family:'Avenir Next','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#efe5cc}
.serif{font-family:'Cormorant Garamond','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif}
.kick{font-size:12px;letter-spacing:.24em;fill:#e57a5f;font-weight:700}
.h{font-size:30px;font-weight:600}
.lab{font-size:11px;letter-spacing:.18em;fill:#b9ab8c;font-weight:700}
.sm{font-size:13px;fill:#b9ab8c}
.md{font-size:14px}
.bd{font-weight:700}
.c{text-anchor:middle}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><pattern id="hx" width="46" height="80" patternUnits="userSpaceOnUse"><path d="M0 20l11.5 -20h23l11.5 20l-11.5 20h-23z M23 60l11.5 -20h23" fill="none" stroke="rgba(239,229,204,.05)" stroke-width="1"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5z" fill="#b9ab8c"/></marker></defs>
<rect x="1" y="1" width="978" height="558" rx="14" fill="#1b1712" stroke="#efe5cc" stroke-width="2"/>
<rect x="1" y="1" width="978" height="558" rx="14" fill="url(#hx)"/>
<rect x="8" y="8" width="964" height="544" rx="9" fill="none" stroke="#4c4333" stroke-width="1"/>
<text x="40" y="50" class="kick" >ARCHITECTURE</text><text x="40" y="90" class="serif h" >One Rust engine. Everything else drives it.</text><rect x="40" y="116" width="440" height="84" rx="9" fill="#241f17" stroke="#efe5cc" stroke-width="1.5"/><text x="60" y="148" class="serif bd" style="font-size:22px">The game in your browser</text><text x="60" y="170" class="sm" >TypeScript UI · 2D hex renderer · phone to desktop</text><text x="60" y="188" class="sm" style="fill:#d6b25c;font-weight:600">engine runs in the page as WebAssembly</text><rect x="500" y="116" width="440" height="84" rx="9" fill="#241f17" stroke="#efe5cc" stroke-width="1.5"/><text x="520" y="148" class="serif bd" style="font-size:22px">The online host</text><text x="520" y="170" class="sm" >Two humans on a team and six AI in one game</text><text x="520" y="188" class="sm" style="fill:#d6b25c;font-weight:600">runs in the host's tab, through a relay</text><rect x="40" y="244" width="900" height="120" rx="9" fill="#1b1712" stroke="#efe5cc" stroke-width="2.4"/><rect x="46" y="250" width="888" height="108" rx="6" fill="none" stroke="#4c4333"/><text x="66" y="282" class="serif bd" style="font-size:28px">legatum-core</text><text x="66" y="304" class="md" >game state + every order + a seed  →  the next state</text><rect x="66" y="318" width="121.60000000000001" height="32" rx="16" fill="#241f17" stroke="#b9ab8c" stroke-width="1.2"/><text x="126.80000000000001" y="339" class="c md" >deterministic</text><rect x="199.60000000000002" y="318" width="157.6" height="32" rx="16" fill="#241f17" stroke="#b9ab8c" stroke-width="1.2"/><text x="278.40000000000003" y="339" class="c md" >integer maths only</text><rect x="369.20000000000005" y="318" width="150.4" height="32" rx="16" fill="#241f17" stroke="#b9ab8c" stroke-width="1.2"/><text x="444.40000000000003" y="339" class="c md" >no rendering code</text><rect x="531.6" y="318" width="308.8" height="32" rx="16" fill="#241f17" stroke="#b9ab8c" stroke-width="1.2"/><text x="686" y="339" class="c md" >one engine, no second copy of the rules</text><path d="M260 202V242" fill="none" stroke="#b9ab8c" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/><path d="M720 202V242" fill="none" stroke="#b9ab8c" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="274" y="228" class="sm" >orders in, view out</text><text x="734" y="228" class="sm" >orders in, view out</text><rect x="40" y="430" width="280" height="98" rx="9" fill="#241f17" stroke="#efe5cc" stroke-width="1.5"/><text x="58" y="462" class="serif bd" style="font-size:22px">Headless runner</text><text x="58" y="484" class="sm" >Rust CLI, parallel across every core</text><text x="58" y="504" class="sm" style="fill:#d6b25c;font-weight:600">thousands of seeded games per batch</text><rect x="350" y="430" width="280" height="98" rx="9" fill="#241f17" stroke="#efe5cc" stroke-width="1.5"/><text x="368" y="462" class="serif bd" style="font-size:22px">The climb</text><text x="368" y="484" class="sm" >Parameter files, spot-instance batches</text><text x="368" y="504" class="sm" style="fill:#d6b25c;font-weight:600">scored on human milestones</text><rect x="660" y="430" width="280" height="98" rx="9" fill="#241f17" stroke="#efe5cc" stroke-width="1.5"/><text x="678" y="462" class="serif bd" style="font-size:22px">The AI</text><text x="678" y="484" class="sm" >Easy, Normal and Hard</text><text x="678" y="504" class="sm" style="fill:#d6b25c;font-weight:600">sees only the view a player sees</text><path d="M180 428V366" fill="none" stroke="#b9ab8c" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/><path d="M800 428V366" fill="none" stroke="#b9ab8c" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/><path d="M322 479H346" fill="none" stroke="#d6b25c" stroke-width="2.2" marker-end="url(#ar)"/><path d="M632 479H656" fill="none" stroke="#d6b25c" stroke-width="2.2" marker-end="url(#ar)"/><text x="198" y="404" class="sm" >plays whole games</text><text x="818" y="404" class="sm" >orders in, view out</text><text x="334" y="420" class="sm c" style="font-size:11px">results</text><text x="644" y="420" class="sm c" style="font-size:11px">tuned</text>
</svg>
