<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Legatum: a historical 4X on a hex map</title>
    <meta name="description" content="A turn-based strategy game in the tradition of Civilization. Real peoples, simultaneous turns, and an AI that plays by your rules. Free and open source." />
    <meta name="theme-color" content="#e6dcc4" />
    <!-- %SITE_URL% is the web build's public address (vite.config.ts): link previews need absolute URLs. -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Legatum" />
    <meta property="og:title" content="Legatum: a historical 4X on a hex map" />
    <meta property="og:description" content="Empires rise and fall. Some are remembered. A free, open-source historical strategy game: play it in your browser." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Legatum wordmark over an illustrated river valley at dawn: a historical 4X on a hex map." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Legatum: a historical 4X on a hex map" />
    <meta name="twitter:description" content="Empires rise and fall. Some are remembered. A free, open-source historical strategy game: play it in your browser." />
    <meta name="twitter:image" content="%SITE_URL%/og.jpg" />
    <meta name="twitter:image:alt" content="The Legatum wordmark over an illustrated river valley at dawn: a historical 4X on a hex map." />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The loading plate below (#boot-plate) shows while the ~7 MB engine downloads; React replaces it on
         mount (main.tsx). Styles only, no script: the hosted Content-Security-Policy (hosted/_headers)
         allows inline styles but no inline scripts. Colours are brand/tokens.css's --bg, --ink, --ink-2, --rule, --accent. -->
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #e6dcc4; }
      #boot-plate { box-sizing: border-box; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; text-align: center; color: #2b2419; background: #e6dcc4; font-family: 'Libre Franklin', 'Franklin Gothic Book', system-ui, sans-serif; }
      #boot-plate .boot-word { margin: 0; font: 600 56px/1 'Cormorant', 'Cormorant Garamond', Garamond, 'Times New Roman', Georgia, serif; letter-spacing: 0.18em; text-indent: 0.18em; }
      #boot-plate .boot-rule { width: 160px; height: 2px; overflow: hidden; background: #bcac8e; }
      #boot-plate .boot-rule i { display: block; width: 40%; height: 100%; background: #9a3322; animation: boot-slide 1.6s ease-in-out infinite alternate; }
      #boot-plate .boot-line { margin: 0; font-size: 16px; line-height: 1.4; }
      #boot-plate .boot-help { max-width: 34ch; margin: 0; font-size: 14px; line-height: 1.45; color: #5b503f; opacity: 0; animation: boot-show 0.6s ease-out 15s forwards; }
      @keyframes boot-slide { from { transform: translateX(-10%); } to { transform: translateX(160%); } }
      @keyframes boot-show { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-plate .boot-rule i { animation: none; width: 100%; }
        #boot-plate .boot-help { animation-duration: 0s; }
      }
      @media (max-width: 480px) { #boot-plate .boot-word { font-size: 40px; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-plate" data-testid="boot-plate" role="status" aria-live="polite">
        <p class="boot-word">LEGATUM</p>
        <div class="boot-rule" aria-hidden="true"><i></i></div>
        <p class="boot-line">Loading the game…</p>
        <p class="boot-help">Still loading? Check your connection, then reload the page.</p>
      </div>
    </div>
    <noscript><p style="margin: 0; padding: 16px; text-align: center; font: 16px/1.4 system-ui, sans-serif; color: #2b2419; background: #e6dcc4;">Legatum needs JavaScript. Turn it on in your browser, then reload the page.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
