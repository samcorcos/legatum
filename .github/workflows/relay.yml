name: Relay

# The online-play lobby and relay (infra/relay): tests on every change, deploy from master.
on:
  push:
    branches: [master]
    paths: ['infra/relay/**', '.github/workflows/relay.yml']
  pull_request:
    paths: ['infra/relay/**', '.github/workflows/relay.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/relay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    # Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/relay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/relay/package-lock.json
      - run: npm ci
      - name: Deploy (skipped until the Cloudflare secrets exist)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the deploy."
            exit 0
          fi
          npx wrangler deploy
