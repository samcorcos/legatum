name: Moderate new issues and pull requests

# Closes clearly off-topic issues and pull requests (politics, mockery, spam, README vandalism) seconds after they
# are opened, during the wave that started 2026-11-25. tools/moderation/moderate.py holds the rules and the safety
# notes. A manual run judges one existing number without acting. It stops on its own after MODERATION_UNTIL; delete this file then.
#
# pull_request_target runs this repository's own copy of the workflow and script with a token, so it must NEVER
# check out or run the pull request's code: the checkout below is the base branch, and the PR is only read through
# the API as text. The token can write issues and pull requests (comment, label, close) and nothing else: no
# contents write, so it cannot push or merge.
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or pull request number to judge (dry run, changes nothing)
        required: false
      hide_comments:
        description: Comment ids to hide as off-topic (acts; maintainers only)
        required: false

permissions: {}

concurrency:
  group: moderate-${{ github.event.comment.id || github.event.issue.number || github.event.pull_request.number || inputs.number || inputs.hide_comments }}

jobs:
  moderate:
    if: github.repository == 'samcorcos/legatum'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      models: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The base branch, never the PR. A manual run (maintainers only) uses the ref it was started on.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools/moderation
      - run: python3 tools/moderation/moderate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODERATION_UNTIL: "2026-12-09"
