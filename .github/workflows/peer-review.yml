name: Peer review

# Run only trusted default-branch code with the write token. PR commits are read
# as git objects by the evaluator, never checked out or executed.
on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review, converted_to_draft]
  merge_group:
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to reevaluate (also initializes existing PRs)
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: write

concurrency:
  # All event types for a PR or merge group share one queue. Read current state when a run starts.
  group: peer-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || github.event.merge_group.head_sha }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.issue.state == 'open')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Evaluate current-commit approvals
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr }}
        run: python3 tools/gates/peer_review.py
