[package]
name = "legatum-balance-probe"
description = "Legatum balance probe: observation and experiments outside the production workspace"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/samcorcos/legatum"

# Deliberately separate from the production workspace: observation and experiments only.
[workspace]

[[bin]]
name = "balance-probe"
path = "balance_probe.rs"

[dependencies]
legatum-core = { path = "../../crates/core" }
legatum-ai = { path = "../../crates/ai" }
legatum-wasm = { path = "../../crates/wasm" }
serde_json = "1"
rayon = "1"
clap = { version = "4", features = ["derive"] }
